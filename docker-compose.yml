services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${ROOST_POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: companycore
      POSTGRES_USER: companycore
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-companycore}
    volumes:
      - companycore_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companycore -d companycore"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://companycore:${SERVICE_PASSWORD_POSTGRES:-companycore}@postgres:5432/companycore?schema=public
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@owner.com}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-password}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-Owner}
      SEED_WORKSPACE_NAME: ${SEED_WORKSPACE_NAME:-Roost}
      SERVICE_URL_BACKEND_3000: ${SERVICE_URL_BACKEND_3000:-http://localhost:3102}
    ports:
      - "${ROOST_BACKEND_PORT:-3102}:3000"

volumes:
  companycore_postgres:
