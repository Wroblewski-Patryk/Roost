[package]
name = "roost-openshell-policy-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
# The runner materializes an unchanged, Git-blob-verified source tree here.
openshell-policy = { path = "../upstream/crates/openshell-policy", version = "=0.0.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[package.metadata.upstream]
repository = "https://github.com/NVIDIA/OpenShell"
git-revision = "d1155aa70042d3e2ee49dbfa15346b108b7c1d92"
release = "v0.0.116"
package = "openshell-policy"
features = []
default-features = false

[profile.release]
opt-level = 1
debug = false
strip = true
codegen-units = 16
